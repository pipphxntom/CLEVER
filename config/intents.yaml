# Intent catalog — source of truth for stakes, tier, fields, keywords.
# stakes: read | mutate | soft_write
# tier: cheap | strong

triage:
  stakes: read
  tier: cheap
  fields: [account, balance, days_overdue, status, contact, invoice_ids]
  keywords:
    - overdue
    - aged
    - aging
    - outstanding
    - delinquent
    - who owes

