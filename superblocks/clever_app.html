<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLEVER — Chat</title>
<style>
:root {
  --bg: #0a0b0e;
  --bg2: #121419;
  --bg3: #181b22;
  --border: #23262e;
  --brand: #6a92ff;
  --brand-hover: #88a8ff;
  --text: #eef0f4;
  --muted: #9aa0ad;
  --good: #46d39a;
  --bad: #ff6b6b;
  --warn: #f5a623;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}
a { color: var(--brand); text-decoration: none; }
.top {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.mark {
  width: 28px; height: 28px; border-radius: 6px; background: var(--brand);
  display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff;
}
.nav { display: flex; gap: 8px; align-items: center; }
.nav a, .nav span {
  padding: 6px 10px; border-radius: 6px; font-size: 12px; color: var(--muted);
}
.nav a.active, .nav span.active { background: #1a2030; color: var(--text); }
.live { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
.dot.on { background: var(--good); }
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  height: calc(100vh - 56px);
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; height: auto; min-height: calc(100vh - 56px); }
  .metrics { border-left: none; border-top: 1px solid var(--border); }
}
.chat {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.thread {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px 12px;
}
.bubble-row { display: flex; margin-bottom: 16px; }
.bubble-row.user { justify-content: flex-end; }
.bubble {
  max-width: min(720px, 92%);
  padding: 12px 14px;
  border-radius: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}
.bubble.user { background: #1a2030; border: 1px solid var(--border); }
.bubble.bot { background: var(--bg3); border: 1px solid var(--border); }
.bubble.sys { background: transparent; color: var(--muted); font-size: 13px; border: none; }
.meta {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  font-family: "SF Mono", Consolas, monospace;
  font-size: 10px;
  color: var(--muted);
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 8px;
}
.composer {
  padding: 12px 16px 18px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.box {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px;
}
textarea {
  flex: 1;
  resize: none;
  background: transparent;
  border: none;
  color: var(--text);
  font: inherit;
  min-height: 44px;
  max-height: 160px;
  outline: none;
}
button.send {
  background: var(--brand);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 10px 16px;
  font-weight: 600;
  cursor: pointer;
}
button.send:disabled { opacity: .45; cursor: not-allowed; }
button.ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 12px;
}
.hint { color: var(--muted); font-size: 11px; margin-top: 8px; }
.metrics {
  border-left: 1px solid var(--border);
  background: var(--bg2);
  padding: 16px;
  overflow-y: auto;
}
.metrics h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
}
.kpi .l { font-size: 11px; color: var(--muted); }
.kpi .v { font-size: 18px; font-weight: 600; margin-top: 4px; }
.feed { margin-top: 16px; }
.feed-row {
  font-size: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
}
.feed-row b { color: var(--text); font-weight: 600; }
.settings { margin-top: 16px; display: grid; gap: 6px; }
.settings input, .settings select {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 8px;
  font-size: 12px;
}
.err { color: var(--bad); font-size: 12px; margin-top: 8px; }
.typing { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="mark">CL</div> CLEVER</div>
  <div class="nav">
    <span class="active">Chat</span>
    <a href="/dashboard">Dashboard</a>
    <a href="/docs">API docs</a>
  </div>
  <div class="live"><div class="dot" id="dot"></div><span id="live">OFFLINE</span></div>
</header>
<div class="layout">
  <section class="chat">
    <div class="thread" id="thread"></div>
    <div class="composer">
      <div class="box">
        <textarea id="q" rows="2" placeholder="Ask CLEVER… e.g. what is today's date"></textarea>
        <button class="send" id="send" type="button">Send</button>
      </div>
      <div class="hint">Replies come from the gateway (RAS / cache / LLM). Metrics on the right update as soon as a call finishes. LLM key lives in server <code>.env</code>, not in this page.</div>
      <div class="err" id="err"></div>
    </div>
  </section>
  <aside class="metrics">
    <h2>Live measure</h2>
    <div class="kpis">
      <div class="kpi"><div class="l">Requests (24h)</div><div class="v" id="kReq">—</div></div>
      <div class="kpi"><div class="l">$0 exits</div><div class="v" id="kSc">—</div></div>
      <div class="kpi"><div class="l">Paid cost</div><div class="v" id="kCost">—</div></div>
      <div class="kpi"><div class="l">Avg latency</div><div class="v" id="kLat">—</div></div>
    </div>
    <div class="feed" id="feed"></div>
    <div class="settings">
      <label class="l">Gateway API key</label>
      <input id="apiKey" type="password" value="dev-key-change-me" />
      <label class="l">Mode</label>
      <select id="mode">
        <option value="clever">clever</option>
        <option value="baseline">baseline</option>
      </select>
    </div>
    <p class="hint" id="prov"></p>
  </aside>
</div>
<script>
const origin = window.location.origin;
let pendingConfirm = null;
let busy = false;
const thread = document.getElementById("thread");
const qEl = document.getElementById("q");

function esc(s) {
  return String(s ?? "").replace(/[&<>"'`]/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"
  }[c]));
}

function key() {
  return (document.getElementById("apiKey").value || "").trim();
}

function pingLive() {
  try { new BroadcastChannel("clever-live").postMessage({ t: Date.now() }); } catch (e) {}
}

function addBubble(role, text, meta) {
  const row = document.createElement("div");
  row.className = "bubble-row " + (role === "user" ? "user" : "");
  const b = document.createElement("div");
  b.className = "bubble " + (role === "user" ? "user" : role === "sys" ? "sys" : "bot");
  b.textContent = text;
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.innerHTML = meta.map(x => `<span class="chip">${esc(x)}</span>`).join("");
    b.appendChild(m);
  }
  row.appendChild(b);
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
  return b;
}

async function fetchStats() {
  try {
    const h = await fetch(origin + "/health");
    const hj = h.ok ? await h.json() : {};
    const sres = await fetch(origin + "/v1/stats", { headers: { "X-API-Key": key() } });
    if (!sres.ok) throw new Error("stats " + sres.status);
    const s = await sres.json();
    document.getElementById("dot").classList.add("on");
    const name = (s.provider || hj.provider || "LIVE").toUpperCase();
    document.getElementById("live").textContent = name;
    if ((hj.live_llm === false) || name === "MOCK") {
      document.getElementById("err").textContent =
        "No live LLM. Put LLM_API_KEY + LLM_BASE_URL + COMPAT_MODEL_* in .env and restart. This is mock.";
    } else {
      document.getElementById("err").textContent = "";
    }
    const sum = s.summary || {};
    document.getElementById("kReq").textContent = sum.total_requests ?? "—";
    document.getElementById("kSc").textContent = (sum.short_circuit_pct != null ? sum.short_circuit_pct : "—") + "%";
    document.getElementById("kCost").textContent = "$" + Number(sum.total_cost_usd || 0).toFixed(4);
    document.getElementById("kLat").textContent = Math.round(sum.avg_latency_ms || 0) + " ms";
    const recent = s.recent_requests || [];
    document.getElementById("feed").innerHTML = recent.slice(0, 8).map(r =>
      `<div class="feed-row"><b>${esc(r.intent || "—")}</b> · ${esc(r.model || "none")} · ${esc(String(r.saved_pct ?? 0))}% · ${esc(String(r.latency_ms || 0))}ms</div>`
    ).join("") || `<div class="feed-row">No requests yet</div>`;
    const backends = hj.backends ? Object.keys(hj.backends).join(", ") : "";
    document.getElementById("prov").textContent = "Provider " + (s.provider || hj.provider || "?") + (backends ? " · ready: " + backends : "");
  } catch (e) {
    document.getElementById("dot").classList.remove("on");
    document.getElementById("live").textContent = "OFFLINE";
    document.getElementById("err").textContent = "Cannot reach gateway or gateway API key rejected. Is uvicorn running? Try 127.0.0.1:8080 (same host as this page).";
  }
}

async function send(confirm) {
  if (busy) return;
  const text = confirm ? (pendingConfirm && pendingConfirm.query) : qEl.value.trim();
  if (!text) return;
  busy = true;
  document.getElementById("send").disabled = true;
  if (!confirm) {
    addBubble("user", text);
    qEl.value = "";
    pendingConfirm = null;
  }
  const typing = addBubble("bot", "Thinking…");
  typing.classList.add("typing");
  const body = {
    query: text,
    mode: document.getElementById("mode").value,
    feature_class: "collections_outreach"
  };
  if (confirm && pendingConfirm && pendingConfirm.token) {
    body.confirm_token = pendingConfirm.token;
    body.stakes = "mutate";
  }
  try {
    const res = await fetch(origin + "/v1/route", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": key() },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({ detail: res.statusText }));
    typing.parentElement.remove();
    if (!res.ok) {
      addBubble("bot", "Error " + res.status + ": " + (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || data)));
    } else {
      const acc = data.accounting || {};
      const chips = [
        data.intent || "intent?",
        data.model_tier || "no-llm",
        data.status,
        "$" + Number(acc.cost_usd || 0).toFixed(5),
        (acc.saved_pct != null ? acc.saved_pct + "% vs baseline" : ""),
        (data.latency_ms || 0) + " ms",
        acc.cache_hit ? "cache HIT" : ""
      ].filter(Boolean);
      addBubble("bot", data.response || "(empty)");
      const last = thread.querySelector(".bubble-row:last-child .bubble");
      if (last) {
        const m = document.createElement("div");
        m.className = "meta";
        m.innerHTML = chips.map(x => `<span class="chip">${esc(x)}</span>`).join("");
        last.appendChild(m);
      }
      if (data.status === "pending_confirmation" && data.confirmation_id) {
        pendingConfirm = { query: text, token: data.confirmation_id };
        const lastBot = thread.querySelector(".bubble-row:last-child .bubble");
        const btn = document.createElement("button");
        btn.className = "ghost";
        btn.type = "button";
        btn.textContent = "Confirm and run model";
        btn.style.marginTop = "10px";
        btn.onclick = () => send(true);
        lastBot.appendChild(btn);
      } else {
        pendingConfirm = null;
      }
    }
    await fetchStats();
    pingLive();
  } catch (e) {
    typing.parentElement.remove();
    addBubble("bot", "Network error: " + e);
  } finally {
    busy = false;
    document.getElementById("send").disabled = false;
    qEl.focus();
  }
}

qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send(false);
  }
});
document.getElementById("send").addEventListener("click", () => send(false));
addBubble("sys", "CLEVER chat. Try “what is today's date” (free), a collections question, or “remit payment for 40211” (confirm hold).");
fetchStats();
setInterval(fetchStats, 2000);
</script>
</body>
</html>
